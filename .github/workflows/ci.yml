name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Type check the frontend
        run: bun run typecheck

      # src-tauri embeds the built frontend (dist/), so it must exist before the Rust tests compile.
      - name: Build the frontend
        run: bunx vite build

      - name: Rust tests
        run: cargo test --workspace --locked

  # The Android app must keep compiling; the full APK build runs only on release.
  android-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the frontend
        run: bunx vite build

      # One target at a time: in parallel, both copy the same files into the
      # android-fs plugin and the second copy fails.
      - name: Check the Android app
        run: |
          ndk_bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android26-clang"
          export CC_armv7_linux_androideabi="$ndk_bin/armv7a-linux-androideabi26-clang"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar" AR_armv7_linux_androideabi="$ndk_bin/llvm-ar"
          cargo check -p rantakit --locked --target aarch64-linux-android
          cargo check -p rantakit --locked --target armv7-linux-androideabi
