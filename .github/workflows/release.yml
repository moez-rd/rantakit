name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  # One release for the tag, made before the builds. When each build made its
  # own, the two jobs raced and one tag got two drafts (#7).
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Create the draft release, or reuse it when the workflow is re-run
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Only release candidates: "Versi baru" reads the latest release,
          # which GitHub never points at a pre-release.
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          # Drafts have no tag yet, so look them up in the list, not by tag.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | sed -n 1p)
          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f name="Rantakit $TAG" \
              -f body="See the assets below to download and install." \
              -F draft=true \
              -F prerelease="$PRERELEASE" \
              --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files that "Versi baru" checks against the
          # public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          # Only release builds make the signed update files and latest.json,
          # so local builds need no signing key.
          args: --config src-tauri/tauri.updater.conf.json
          # Upload into the release create-release made; never make another.
          releaseId: ${{ needs.create-release.outputs.release_id }}

  publish-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      # An APK signed with any other key can't install over the last one, so
      # never publish one unsigned.
      - name: Stop if the release keystore is missing
        run: |
          for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set, so the APKs can't be signed."
              exit 1
            fi
          done

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: oven-sh/setup-bun@v2

      - name: Install Rust stable with the Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: android

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # build.gradle.kts signs release builds with this file when it exists.
      - name: Write the release keystore
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<PROPERTIES
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          PROPERTIES

      # The runner comes with the Android SDK and NDK.
      - name: Build the APKs
        run: NDK_HOME="$ANDROID_NDK_LATEST_HOME" bun tauri android build --apk --split-per-abi --target aarch64 --target armv7

      - name: Check the signatures and name the APKs
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          outputs=src-tauri/gen/android/app/build/outputs/apk
          mkdir -p apk
          for abi in arm64:arm64 arm:armv7; do
            apk="$outputs/${abi%%:*}/release/app-${abi%%:*}-release.apk"
            "$apksigner" verify "$apk"
            cp "$apk" "apk/Rantakit_${version}_${abi##*:}.apk"
          done

      # tauri-action uploads the desktop files; these go into the same draft.
      - name: Upload the APKs to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          for apk in apk/*.apk; do
            name=$(basename "$apk")
            # A re-run replaces the APK it uploaded before.
            old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq ".[] | select(.name == \"$name\") | .id")
            if [ -n "$old" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
            fi
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary "@$apk" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              > /dev/null
          done
