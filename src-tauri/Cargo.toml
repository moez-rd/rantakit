[package]
name = "rantakit"
version = "0.2.0"
description = "Free, open-source file toolkit that works offline"
authors = ["moez-rd"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/moez-rd/rantakit"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rantakit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
rantakit-tasks = { path = "../crates/rantakit-tasks" }
tauri-plugin-dialog = "2"
thiserror = "2"
serde_json = "1"

# "Versi baru": the update check and install. Stores handle updates on
# mobile, so the plugin is desktop only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# The system share sheet ("Bagikan") on the Result page, and the rounded
# corners of the undecorated window.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel_DataTransfer",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_UI_Shell",
] }
windows-collections = "0.3"
